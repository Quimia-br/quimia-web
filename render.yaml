services:
  - type: web
    runtime: static
    name: quimia
    branch: main
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-store
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /reset-password*
        name: Cache-Control
        value: no-store
      - path: /reset-password/*
        name: Cache-Control
        value: no-store
      - path: /recover-password*
        name: Cache-Control
        value: no-store
      - path: /recuperar-senha*
        name: Cache-Control
        value: no-store
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
