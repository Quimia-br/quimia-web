services:
  - type: web
    runtime: static
    name: quimia
    branch: main
    # O deploy é disparado pelo workflow ci.yml (Deploy Hook) quando uma Release é publicada.
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
