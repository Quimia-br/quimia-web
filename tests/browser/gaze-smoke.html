<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8" />
<title>Quimia · teste do runtime de olhar</title>
<main>
  <h1>Teste do runtime MediaPipe</h1>
  <p>Este teste usa uma imagem vazia. Não solicita câmera.</p>
  <button id="run">Testar reconhecimento local</button>
  <p id="result" role="status">Aguardando início.</p>
</main>
<script type="module">
  import GazeWorker from "/src/lib/gaze/worker.ts?worker";
  document.getElementById("run").onclick = () => {
    const worker = new GazeWorker();
    const result = document.getElementById("result");
    result.textContent = "Carregando modelo…";
    const timeout = setTimeout(() => { result.textContent = "Falha: tempo esgotado."; worker.terminate(); }, 30000);
    worker.onerror = event => { clearTimeout(timeout); result.textContent = `Falha: ${event.message}`; worker.terminate(); };
    worker.onmessage = async event => {
      if (event.data.type === "ready") {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 256;
        const bitmap = await createImageBitmap(canvas);
        worker.postMessage({ type: "frame", image: bitmap, timestamp: performance.now() }, [bitmap]);
      } else {
        clearTimeout(timeout);
        result.textContent = event.data.type === "features" && event.data.features === null
          ? "Sucesso: modelo local carregado e imagem sem rosto reconhecida no worker."
          : `Falha: ${event.data.detail || event.data.message || JSON.stringify(event.data)}`;
        worker.terminate();
      }
    };
    worker.postMessage({ type: "init", base: `${location.origin}/` });
  };
</script>
</html>
